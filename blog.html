<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Журнал — KNOW consult travel</title>
    <meta
      name="description"
      content="Журнал KNOW consult travel: идеи для путешествий, маршруты и полезные советы."
    />
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/pages.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body data-page="blog">
    <div data-include="header"></div>
    <main>
      <section class="page-hero">
        <div class="wrap">
          <div class="crumbs"><a href="index.html">Главная</a> / Журнал</div>
          <h1>Заметки с дороги</h1>
          <p>
            Вдохновение, честные советы и маршруты, которые хочется сохранить.
            Читаем, мечтаем, собираем чемодан.
          </p>
          <div class="filters" id="blog-filters"></div>
        </div>
      </section>
      <section class="section">
        <div class="wrap"><div class="post-grid" id="blog-list"></div></div>
      </section>
      <section class="section section--sand">
        <div class="wrap review-wrap">
          <div>
            <p class="section-kicker">Нужен совет?</p>
            <h2>Поможем выбрать без путеводителей</h2>
          </div>
          <figure class="review-card">
            <blockquote>
              «Расскажите, каким хотите почувствовать свой отдых — иногда этого
              достаточно, чтобы найти верное место.»
            </blockquote>
            <figcaption>
              <span class="review-ava">K</span
              ><span
                ><b>Команда KNOW consult</b><br />на связи каждый день</span
              >
            </figcaption>
          </figure>
        </div>
      </section>
      <section class="cta-band">
        <div class="wrap">
          <div>
            <h2>Есть вопрос о поездке?</h2>
            <p>Спросите у нас — поделимся опытом и подскажем следующий шаг.</p>
          </div>
          <button class="btn btn-light" type="button" data-consult>
            Задать вопрос <span class="arrow">→</span>
          </button>
        </div>
      </section>
    </main>
    <div data-include="footer"></div>
    <script src="js/config.js"></script>
    <script src="js/data.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/render.js"></script>
    <script src="js/mail.js"></script>
    <script src="js/form.js"></script>
  </body>
</html>
